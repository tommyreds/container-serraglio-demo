<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1C2E">
<title>Pannello — Container Serraglio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/logo-blu.png">
<link rel="apple-touch-icon" href="img/icona-192.png">
<link rel="preload" href="fonts/bricolage-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="pannello">

<!-- ============ accesso ============ -->
<main class="accesso" id="accesso" hidden>
  <img src="img/logo-bianco.png" alt="" width="113" height="166">
  <h1>Pannello del locale</h1>
  <label for="pin" class="guida">Scrivi il PIN di sei cifre: all'ultima cifra si entra da soli</label>
  <input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6"
         autocomplete="current-password" aria-describedby="errore-accesso">
  <p class="errore" id="errore-accesso" role="alert"></p>
  <button class="grosso" type="button" id="entra">Entra</button>
</main>

<!-- ============ lavoro ============ -->
<div id="lavoro" hidden>
  <header class="barra-alta">
    <h1 id="titolo-schermata" tabindex="-1">Oggi</h1>
    <a class="link-sito" href="./" target="_blank" rel="noopener">Vedi il sito</a>
  </header>

  <main class="schermata" id="schermata-oggi" aria-labelledby="titolo-schermata"></main>
  <main class="schermata" id="schermata-menu" aria-labelledby="titolo-schermata" hidden></main>
  <main class="schermata" id="schermata-info" aria-labelledby="titolo-schermata" hidden></main>

  <nav class="barra-nav" aria-label="Sezioni del pannello">
    <button type="button" data-schermata="oggi" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Oggi
    </button>
    <button type="button" data-schermata="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Menù
    </button>
    <button type="button" data-schermata="info">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
      Info
    </button>
  </nav>
</div>

<!-- editor di un prodotto o di una categoria -->
<dialog class="foglio foglio-pannello" id="editor" aria-labelledby="titolo-editor">
  <div class="foglio-testa">
    <h2 id="titolo-editor"></h2>
    <button type="button" class="chiudi" data-chiudi aria-label="Chiudi">×</button>
  </div>
  <form class="foglio-corpo" id="modulo-editor" novalidate></form>
</dialog>

<!-- conferma prima di azioni che non si possono annullare -->
<dialog class="foglio foglio-conferma" id="conferma" aria-labelledby="testo-conferma">
  <div class="foglio-corpo">
    <p id="testo-conferma"></p>
    <div class="chiedi">
      <button type="button" class="grosso pericolo" id="conferma-si">Sì</button>
      <button type="button" class="grosso secondario" id="conferma-no">Annulla</button>
    </div>
  </div>
</dialog>

<!-- fuori da #lavoro: resta annunciabile anche all'uscita, quando #lavoro si nasconde -->
<p class="esito" id="esito" role="status" aria-live="polite"></p>
<p class="esito errore" id="esito-errore" role="alert"></p>

<script type="module" src="admin.js"></script>
</body>
</html>
